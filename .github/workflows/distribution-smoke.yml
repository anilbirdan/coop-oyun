name: Dagitim ZIP Mac acilis testi
on:
  workflow_dispatch:
    inputs:
      archive_sha256:
        required: true
        type: string
      source_hash:
        required: true
        type: string
permissions:
  # Draft asset access; token is passed only to the download step.
  contents: write
jobs:
  package:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Hesap verisi icermeyen taslak uygulama ZIP dosyasini al
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download v0.3.0 --pattern Coop-Oyun-M5-0.3.0.zip --dir .local/distribution
      - name: Gercek dagitim dosyasini dogrula ve ac
        env:
          COOP_ARCHIVE_SHA: ${{ inputs.archive_sha256 }}
          COOP_SOURCE_HASH: ${{ inputs.source_hash }}
        run: node scripts/test-distribution.mjs
