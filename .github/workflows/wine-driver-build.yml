name: Acik kaynak Wine grafik surucusu denemesi
on:
  workflow_dispatch:
    inputs:
      publish_driver:
        description: Basarili surucuyu ve tam kaynagini taslak surume kaydet
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: coop-wine-driver-build
  cancel-in-progress: false
jobs:
  build-driver:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: wine-mirror/wine
          ref: 7b3fff76fa5178f6ce0141b2c776afa2a822f101
          path: .local/wine-source
          persist-credentials: false
      - name: Dogrulanmis standart Wine ve kaynak yamasi
        run: node scripts/build-wine-driver.mjs prepare
      - name: Yalniz Mac grafik surucusunu derle
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install bison mingw-w64
          export PATH="$(brew --prefix bison)/bin:$PATH"
          mkdir -p .local/wine-build
          cd .local/wine-build
          CC="clang -arch x86_64" CXX="clang++ -arch x86_64" ../wine-source/configure --build=x86_64-apple-darwin --host=x86_64-apple-darwin --enable-win64 --disable-tests --without-x --without-wayland --without-gstreamer --without-vulkan --without-cups --without-freetype --without-fontconfig --without-gettext
          if make -n dlls/winemac.drv/winemac.so >/dev/null 2>&1; then
            make -j3 dlls/winemac.drv/winemac.so
          else
            make -j3 dlls/winemac.drv/x86_64-unix/winemac.so
          fi
      - name: Yeni surucu ve Windows komutunu sina
        run: node scripts/build-wine-driver.mjs verify
      - name: Yalniz basarili adayi kaynaklariyla taslak surume kaydet
        if: inputs.publish_driver
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/package-wine-driver.mjs
          gh release create wine-driver-11.18-coop1 .local/driver-dist/* --target "$GITHUB_SHA" --draft --title "Wine 11.18 Coop DXMT driver (deneysel)" --notes-file .local/driver-release-notes.md
